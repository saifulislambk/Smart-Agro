# ====================================================================
# Render.com Blueprint Specification for Smart Agro
# Deploy with one click on Render: https://render.com
# ====================================================================
services:
  - type: web
    name: smart-agro
    env: node
    plan: free
    region: singapore # Closest low-latency region to Bangladesh
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: smart-agro-db
          property: connectionString
      - key: OPENWEATHER_API_KEY
        sync: false # Set in Render Dashboard or leave empty for automated fallback

databases:
  - name: smart-agro-db
    plan: free
    region: singapore
    databaseName: smart_agro
    user: smart_agro_user

